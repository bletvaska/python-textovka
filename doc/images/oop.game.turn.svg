<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" font-family="Noto Sans, DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#546e7a"/>
    </marker>
  </defs>
  <rect width="960" height="300" fill="#ffffff"/>
  <text x="20" y="34" font-size="22" font-weight="bold" fill="#263238">Jeden ťah hry = jedna otočka hernej slučky</text>

  <!-- step 1 -->
  <g font-size="13" fill="#263238">
    <rect x="20" y="60" width="200" height="160" rx="12" fill="#eceff1" stroke="#455a64" stroke-width="2"/>
    <circle cx="44" cy="86" r="14" fill="#455a64"/>
    <text x="44" y="91" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    <text x="66" y="91" font-size="15" font-weight="bold">Hráč povie vetu</text>
    <text x="34" y="122">Človek napíše, čo chce</text>
    <text x="34" y="140">urobiť, napr.</text>
    <text x="34" y="158" font-family="DejaVu Sans Mono, Consolas, monospace">vezmi bič</text>
    <rect x="30" y="178" width="180" height="30" rx="6" fill="#ffffff"/>
    <text x="40" y="198" font-size="12" font-family="DejaVu Sans Mono, Consolas, monospace" fill="#6a1b9a">line = input('&gt; ')</text>
  </g>
  <line x1="222" y1="140" x2="256" y2="140" stroke="#546e7a" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- step 2 -->
  <g font-size="13" fill="#263238">
    <rect x="260" y="60" width="200" height="160" rx="12" fill="#e3edf7" stroke="#306998" stroke-width="2"/>
    <circle cx="284" cy="86" r="14" fill="#306998"/>
    <text x="284" y="91" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    <text x="306" y="91" font-size="15" font-weight="bold">Pán hry hľadá</text>
    <text x="274" y="122">V ruke nájde kartu</text>
    <text x="274" y="140">podľa názvu. Nenájde?</text>
    <text x="274" y="158">„Taký príkaz nepoznám.“</text>
    <rect x="270" y="178" width="180" height="30" rx="6" fill="#ffffff"/>
    <text x="280" y="198" font-size="12" font-family="DejaVu Sans Mono, Consolas, monospace" fill="#6a1b9a">cmd = parse_line(…)</text>
  </g>
  <line x1="462" y1="140" x2="496" y2="140" stroke="#546e7a" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- step 3 -->
  <g font-size="13" fill="#263238">
    <rect x="500" y="60" width="200" height="160" rx="12" fill="#e0f7fa" stroke="#00838f" stroke-width="2"/>
    <circle cx="524" cy="86" r="14" fill="#00838f"/>
    <text x="524" y="91" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
    <text x="546" y="91" font-size="15" font-weight="bold">Karta sa zahrá</text>
    <text x="514" y="122">Vykoná sa jej efekt</text>
    <text x="514" y="140">na hernom stole: bič</text>
    <text x="514" y="158">sa presunie do batohu.</text>
    <rect x="510" y="178" width="180" height="30" rx="6" fill="#ffffff"/>
    <text x="520" y="198" font-size="12" font-family="DejaVu Sans Mono, Consolas, monospace" fill="#6a1b9a">cmd.exec(context)</text>
  </g>
  <line x1="702" y1="140" x2="736" y2="140" stroke="#546e7a" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- step 4 -->
  <g font-size="13" fill="#263238">
    <rect x="740" y="60" width="200" height="160" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
    <circle cx="764" cy="86" r="14" fill="#2e7d32"/>
    <text x="764" y="91" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
    <text x="786" y="91" font-size="15" font-weight="bold">Koniec ťahu</text>
    <text x="754" y="122">Miestnosť s figúrkou</text>
    <text x="754" y="140">vyhodnotí svoje</text>
    <text x="754" y="158">pravidlo (napr. palivo).</text>
    <rect x="750" y="178" width="180" height="30" rx="6" fill="#ffffff"/>
    <text x="760" y="198" font-size="12" font-family="DejaVu Sans Mono, Consolas, monospace" fill="#6a1b9a">current_room.act(…)</text>
  </g>

  <!-- loop back -->
  <path d="M840,222 V256 H120 V226" fill="none" stroke="#546e7a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="300" y="246" width="360" height="20" fill="#ffffff"/>
  <text x="480" y="261" font-size="13" fill="#546e7a" text-anchor="middle">ďalší ťah, kým sa hra neskončí (<tspan font-family="DejaVu Sans Mono, Consolas, monospace">while</tspan>)</text>
</svg>
