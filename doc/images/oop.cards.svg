<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Noto Sans, DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="960" height="480" fill="#ffffff"/>
  <text x="20" y="34" font-size="22" font-weight="bold" fill="#263238">Tri druhy kariet v našej hre</text>

  <!-- ===== annotations on the left ===== -->
  <g fill="#263238">
    <path d="M150,120 h-10 v170 h10" fill="none" stroke="#546e7a" stroke-width="2"/>
    <text x="20" y="196" font-size="15" font-weight="bold">vlastnosti</text>
    <text x="20" y="214" font-size="12" fill="#546e7a">čo je na karte</text>
    <text x="20" y="232" font-size="13" font-family="DejaVu Sans Mono, Consolas, monospace" fill="#6a1b9a">→ atribúty</text>

    <path d="M150,300 h-10 v130 h10" fill="none" stroke="#546e7a" stroke-width="2"/>
    <text x="20" y="352" font-size="15" font-weight="bold">akcia</text>
    <text x="20" y="370" font-size="12" fill="#546e7a">čo karta robí</text>
    <text x="20" y="388" font-size="13" font-family="DejaVu Sans Mono, Consolas, monospace" fill="#6a1b9a">→ metóda</text>
  </g>

  <!-- ===== room card ===== -->
  <g font-size="14" fill="#263238">
    <rect x="170" y="60" width="245" height="385" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5"/>
    <path d="M170,112 V72 a12,12 0 0 1 12,-12 H403 a12,12 0 0 1 12,12 V112 Z" fill="#2e7d32"/>
    <text x="184" y="80" font-size="11" fill="#c8e6c9" letter-spacing="1.5">MIESTNOSŤ</text>
    <text x="184" y="102" font-size="20" font-weight="bold" fill="#ffffff">lietadlo</text>

    <text x="184" y="138"><tspan font-weight="bold">názov:</tspan> lietadlo</text>
    <text x="184" y="162"><tspan font-weight="bold">opis:</tspan> Prebudil si sa</text>
    <text x="184" y="181">v malom lietadle nad</text>
    <text x="184" y="200">egyptskou púšťou…</text>
    <text x="184" y="226"><tspan font-weight="bold">východy:</tspan> dolu</text>
    <text x="184" y="250" font-weight="bold">predmety:</text>
    <rect x="184" y="258" width="44" height="26" rx="5" fill="#fce4ec" stroke="#ad1457" stroke-width="1.5"/>
    <text x="206" y="276" font-size="12" font-weight="bold" fill="#ad1457" text-anchor="middle">bič</text>
    <rect x="236" y="258" width="122" height="26" rx="5" fill="#fce4ec" stroke="#ad1457" stroke-width="1.5"/>
    <text x="297" y="276" font-size="12" font-weight="bold" fill="#ad1457" text-anchor="middle">prázdne sedadlá</text>

    <rect x="182" y="300" width="221" height="130" rx="8" fill="#c8e6c9"/>
    <text x="194" y="322" font-size="12" font-weight="bold" fill="#1b5e20">NA KONCI ŤAHU</text>
    <text x="391" y="322" font-size="12" font-family="DejaVu Sans Mono, Consolas, monospace" fill="#6a1b9a" text-anchor="end">.act()</text>
    <text x="194" y="346">Odpočítaj 1 z paliva.</text>
    <text x="194" y="365">Keď palivo dôjde,</text>
    <text x="194" y="384">lietadlo havaruje</text>
    <text x="194" y="403">a hra sa končí.</text>
  </g>

  <!-- ===== item card ===== -->
  <g font-size="14" fill="#263238">
    <rect x="435" y="60" width="245" height="385" rx="12" fill="#fce4ec" stroke="#ad1457" stroke-width="2.5"/>
    <path d="M435,112 V72 a12,12 0 0 1 12,-12 H668 a12,12 0 0 1 12,12 V112 Z" fill="#ad1457"/>
    <text x="449" y="80" font-size="11" fill="#f8bbd0" letter-spacing="1.5">PREDMET</text>
    <text x="449" y="102" font-size="20" font-weight="bold" fill="#ffffff">padák</text>

    <text x="449" y="138"><tspan font-weight="bold">názov:</tspan> padák</text>
    <text x="449" y="162"><tspan font-weight="bold">opis:</tspan> Obyčajný padák.</text>
    <text x="449" y="181">Made in U.S.A. 1933</text>
    <text x="449" y="207"><tspan font-weight="bold">dá sa zobrať:</tspan> áno</text>
    <text x="449" y="231"><tspan font-weight="bold">dá sa použiť:</tspan> áno</text>

    <rect x="447" y="300" width="221" height="130" rx="8" fill="#f8bbd0"/>
    <text x="459" y="322" font-size="12" font-weight="bold" fill="#880e4f">PRI POUŽITÍ</text>
    <text x="656" y="322" font-size="12" font-family="DejaVu Sans Mono, Consolas, monospace" fill="#6a1b9a" text-anchor="end">.use()</text>
    <text x="459" y="346">Ak práve padáš, padák</text>
    <text x="459" y="365">sa otvorí a pristaneš</text>
    <text x="459" y="384">na púšti. Inak sa</text>
    <text x="459" y="403">nestane nič.</text>
  </g>

  <!-- ===== action card ===== -->
  <g font-size="14" fill="#263238">
    <rect x="700" y="60" width="245" height="385" rx="12" fill="#e0f7fa" stroke="#00838f" stroke-width="2.5"/>
    <path d="M700,112 V72 a12,12 0 0 1 12,-12 H933 a12,12 0 0 1 12,12 V112 Z" fill="#00838f"/>
    <text x="714" y="80" font-size="11" fill="#b2ebf2" letter-spacing="1.5">AKCIA (PRÍKAZ)</text>
    <text x="714" y="102" font-size="20" font-weight="bold" fill="#ffffff">vezmi</text>

    <text x="714" y="138"><tspan font-weight="bold">názov:</tspan> vezmi</text>
    <text x="714" y="162"><tspan font-weight="bold">opis:</tspan> vezme predmet</text>
    <text x="714" y="181">z miestnosti a vloží</text>
    <text x="714" y="200">ho do batohu</text>

    <rect x="712" y="300" width="221" height="130" rx="8" fill="#b2ebf2"/>
    <text x="724" y="322" font-size="12" font-weight="bold" fill="#006064">EFEKT</text>
    <text x="921" y="322" font-size="12" font-family="DejaVu Sans Mono, Consolas, monospace" fill="#6a1b9a" text-anchor="end">.exec()</text>
    <text x="724" y="346">1. Nájdi predmet</text>
    <text x="724" y="365">    v miestnosti.</text>
    <text x="724" y="384">2. Nedá sa zobrať? Koniec.</text>
    <text x="724" y="403">3. Presuň ho do batohu.</text>
  </g>

  <text x="20" y="470" font-size="12" fill="#546e7a">Každá karta je jeden objekt. Na karte sú jej vlastnosti a pravidlo, ktoré hovorí, čo sa stane, keď sa karta použije.</text>
</svg>
